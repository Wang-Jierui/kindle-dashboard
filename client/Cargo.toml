[package]
name = "kindle-dashboard"
version = "0.1.0"
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.92"

[dependencies]
slint = { version = "=1.18.0", default-features = false, features = ["compat-1-2", "std", "renderer-software", "software-renderer-path"] }

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint-backend-kindle = { version = "=0.7.1", path = "vendor/slint-backend-kindle" }
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
url = "2"

[target.'cfg(not(target_os = "linux"))'.dependencies]
slint = { version = "=1.18.0", default-features = false, features = ["backend-winit"] }

[profile.release]
strip = true

[build-dependencies]
slint-build = "=1.18.0"
